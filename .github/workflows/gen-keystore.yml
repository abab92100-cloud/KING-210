name: Generate KING release keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore king-release.keystore \
            -alias king-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KING_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KING_KEY_PASSWORD }}" \
            -dname "CN=KING Trading, OU=Mobile, O=KING, L=Riyadh, C=SA"

      - name: Upload keystore (save as secret!)
        uses: actions/upload-artifact@v4
        with:
          name: king-release-keystore
          path: king-release.keystore
          retention-days: 1

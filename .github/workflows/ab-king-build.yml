name: Build AB-KING APK (from King repo)
on:
  push:
    branches: ["main", "vibe/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web + server
        working-directory: AB-KING/app/ab-king
        run: |
          npm ci
          npm run build
          npm run build:server
      - name: Sync Capacitor Android
        working-directory: AB-KING/app/ab-king
        run: npx cap sync android
      - name: Build APK
        working-directory: AB-KING/app/ab-king/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Commit APK to repo (direct download link)
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          cp AB-KING/app/ab-king/android/app/build/outputs/apk/release/app-release.apk releases/AB-KING-latest.apk
          git add releases/AB-KING-latest.apk
          git commit -m "ci: update AB-KING-latest.apk [skip ci]" || echo "no change"
          git push

name: Build AB-KING APK (from King repo)
on:
  push:
    branches: ["main", "vibe/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web + server
        working-directory: AB-KING/app/ab-king
        run: |
          npm ci
          npm run build
          npm run build:server
      - name: Sync Capacitor Android
        working-directory: AB-KING/app/ab-king
        run: npx cap sync android
      - name: Build APK
        working-directory: AB-KING/app/ab-king/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AB-KING-apk
          path: AB-KING/app/ab-king/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
